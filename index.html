<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="신동운 선생님이 교실에서 쓰려고 만든 웹앱과 수업 노하우를 모아 두는 기록장">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>동카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 한 줄 시간축(월별) 위에 웹앱 카드와 노하우 노트가 섞여 쌓이는 기록장. 위쪽은 이름표, 아래는 필터. */
:root{
  --paper:#f3f6f8; --card:#ffffff; --ink:#18232e; --muted:#5b6b78; --line:#d5dee5;
  --mark:#ffd84a; --app:#1f6f8b; --app-soft:#dcedf3; --note:#7a4fb0; --note-soft:#ece4f6;
  --display:"Do Hyeon","Gothic A1",system-ui,sans-serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11181e; --card:#18222a; --ink:#e6edf2; --muted:#9aaab6; --line:#2a3842;
  --mark:#e3bd2a; --app:#6cc0dc; --app-soft:#183441; --note:#c3a2ef; --note-soft:#2b2240; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11181e; --card:#18222a; --ink:#e6edf2; --muted:#9aaab6; --line:#2a3842;
  --mark:#e3bd2a; --app:#6cc0dc; --app-soft:#183441; --note:#c3a2ef; --note-soft:#2b2240; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 64px}

.demo{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-bottom:28px}

header{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;border-bottom:3px solid var(--ink);padding-bottom:20px}
header>div{min-width:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(48px,11vw,84px);line-height:1;margin:6px 0 10px;letter-spacing:-.01em}
h1 .hl{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%)}
.intro{margin:0;max-width:34em;color:var(--muted);text-wrap:pretty}
.counts{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.counts div{text-align:right}
.counts b{display:block;font-family:var(--display);font-weight:400;font-size:40px;line-height:1}
.counts span{font-size:12px;color:var(--muted)}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:22px 0 8px}
.filters .label{font-size:12px;color:var(--muted);margin-right:4px;letter-spacing:.04em}
.chip{font:600 13px var(--body);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:focus-visible,.open:focus-visible,summary:focus-visible{outline:2px solid var(--app);outline-offset:2px}
.sep{width:1px;height:20px;background:var(--line);margin:0 6px}

.month{display:grid;grid-template-columns:96px 1fr;gap:20px;margin-top:34px}
.month h2{font-family:var(--mono);font-weight:500;font-size:14px;color:var(--muted);margin:4px 0 0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start}
.entries{display:grid;gap:12px;min-width:0;border-left:2px solid var(--line);padding-left:20px}

.entry{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.entry::before{content:"";position:absolute;left:-28px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--app)}
.entry.note::before{border-color:var(--note)}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px}
.kind{font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:2px 8px;border-radius:4px;background:var(--app-soft);color:var(--app)}
.note .kind{background:var(--note-soft);color:var(--note)}
.date{font-family:var(--mono);color:var(--muted)}
.entry h3{font-size:18px;font-weight:800;margin:8px 0 4px;text-wrap:balance}
.entry p{margin:0;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
.meta span{color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;color:var(--muted)}
.tag::before{content:"#"}
.open{font:600 13px var(--body);color:var(--app);text-decoration:none;border:1px solid currentColor;border-radius:6px;padding:4px 10px;white-space:nowrap}
.open:hover{background:var(--app-soft)}

details{margin-top:10px}
summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--note);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" 펼치기"}
details[open] summary::after{content:" 접기"}
.body{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);max-width:62ch}
.body p{color:var(--ink);margin:0 0 8px}
.body ol,.body ul{margin:0 0 8px;padding-left:20px}

.empty{color:var(--muted);margin-top:30px}
footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

@media (max-width:600px){
  header{grid-template-columns:1fr}
  .counts div{text-align:left}
  .month{grid-template-columns:1fr;gap:10px}
  .month h2{position:static}
  .entries{padding-left:16px}
  .entry::before{left:-24px}
}
@media (prefers-reduced-motion:no-preference){.entry{transition:border-color .15s}.entry:hover{border-color:var(--muted)}}
</style>
</head>
<body>

<div class="wrap">
  <div class="demo">예시 페이지입니다. 앱 이름은 선생님이 만든 것들을 넣었고, 링크와 노하우 글은 자리를 채운 견본이에요.</div>

  <header>
    <div>
      <div class="eyebrow">반월초 · 5·6학년 · 신동운</div>
      <h1><span class="hl">동카이브</span></h1>
      <p class="intro">교실에서 쓰려고 만든 웹앱과, 만들고 수업하며 배운 것을 시간 순서대로 쌓아 두는 곳입니다.</p>
    </div>
    <div class="counts">
      <div><b id="nApp">0</b><span>웹앱</span></div>
      <div><b id="nNote">0</b><span>노하우</span></div>
    </div>
  </header>

  <div class="filters" id="filters" role="group" aria-label="보기 필터"></div>
  <main id="list"></main>
  <p class="empty" id="empty" hidden>이 조건에 맞는 기록이 아직 없어요.</p>

  <footer>새 기록은 이 파일 맨 아래의 기록 목록에 한 줄씩 추가하면 됩니다. 날짜 순서는 자동으로 정리돼요.</footer>
</div>

<script>
/* ===== 기록 목록: 여기에만 추가하세요 =====
   kind: "app"(웹앱) 또는 "note"(노하우)
   subject: 국어 · 영어 · 사회 · 실과 · 학급운영 · 행사 · 만들기 */
const RECORDS = [
  {kind:"app", date:"2026-11-06", subject:"실과", title:"반월봇",
   desc:"6학년 실과 시간에 묻고 답하는 AI 튜터 챗봇.",
   grade:"6학년", tool:"Apps Script", tags:["AI","챗봇","정보연수"], url:"#"},
  {kind:"app", date:"2026-11-04", subject:"실과", title:"과목별 단어봇",
   desc:"동료 선생님 요청으로 만든 6학년 과목별 단어 검색 도구.",
   grade:"6학년", tool:"Apps Script", tags:["검색","동료와 함께"], url:"#"},
  {kind:"note", date:"2026-11-03", subject:"만들기", title:"Apps Script로 챗봇을 만들 때 먼저 정해 둔 세 가지",
   desc:"수업용 챗봇은 기능보다 '무엇을 안 할지'를 먼저 정해야 했다.",
   tags:["AI","챗봇"],
   body:`<p>(예시 글) 반월봇을 만들며 처음부터 정해 두니 편했던 것들입니다.</p>
   <ol><li><b>답을 바로 주지 않기</b>: 힌트 → 질문 → 정답 순서로.</li>
   <li><b>범위 정하기</b>: 단원 밖 질문은 정중하게 돌려보내기.</li>
   <li><b>기록 남기기</b>: 학생이 자주 묻는 질문을 시트에 쌓아 다음 수업에 반영.</li></ol>`},
  {kind:"app", date:"2026-11-01", subject:"행사", title:"안중근 뮤지컬 배역 뽑기",
   desc:"학예회 뮤지컬 〈안중근: 누가 죄인인가〉 32개 배역을 명단 입력 후 랜덤으로 배정.",
   grade:"5·6학년", tool:"HTML", tags:["학예회","뽑기"], url:"#"},
  {kind:"app", date:"2026-10-28", subject:"학급운영", title:"우리 반 학교 마을",
   desc:"학생들이 함께 도서관·놀이터·텃밭·미술 공방을 짓는 협동 마을 게임.",
   grade:"5학년", tool:"Firebase", tags:["협동","멀티플레이"], url:"#"},
  {kind:"app", date:"2026-10-04", subject:"사회", title:"사회 학습지 웹앱",
   desc:"한글 파일로 나눠 주던 사회 학습지를 태블릿에서 바로 풀 수 있게 옮긴 것.",
   grade:"5학년", tool:"HTML", tags:["학습지","HWP 옮기기"], url:"#"},
  {kind:"note", date:"2026-10-02", subject:"만들기", title:"한글 학습지를 웹앱으로 옮길 때 체크리스트",
   desc:"그대로 옮기면 종이보다 불편해진다. 바꿔야 할 것만 골라서.",
   tags:["학습지","HWP 옮기기"],
   body:`<p>(예시 글) 옮기기 전에 확인하는 것들:</p>
   <ul><li>빈칸은 입력칸으로, 선 긋기는 선택지로 바꾸기</li>
   <li>한 화면에 한 문항, 태블릿 세로 화면 기준</li>
   <li>채점이 필요한 문항과 생각을 쓰는 문항 구분하기</li>
   <li>제출하면 선생님 화면에 바로 모이게</li></ul>`},
  {kind:"app", date:"2026-09-22", subject:"영어", title:"알파벳 마을",
   desc:"5학년 2학기 Lesson 7~12 단어와 핵심 표현을 복습하는 3D 마을 게임. 선생님은 촌장님.",
   grade:"5학년", tool:"Firebase", tags:["복습","멀티플레이","3D"], url:"#"},
  {kind:"note", date:"2026-09-18", subject:"만들기", title:"태블릿 15대로 실시간 게임 돌려 본 기록",
   desc:"안드로이드 태블릿에서 멀티플레이 게임을 처음 돌린 날 생긴 일과 해결 방법.",
   tags:["Firebase","태블릿","멀티플레이"],
   body:`<p>(예시 글) 15명이 한꺼번에 접속했을 때 미리 알았으면 좋았을 것:</p>
   <ul><li>첫 접속은 와이파이가 몰리니 입장 시간을 모둠별로 나누기</li>
   <li>3D 화면은 저사양 태블릿용 '가벼운 모드'를 따로 두기</li>
   <li>새로고침해도 이어지도록 학생 번호로 자리 기억하기</li></ul>`},
  {kind:"app", date:"2026-09-16", subject:"국어", title:"문장 성분 사목놀이",
   desc:"주어·목적어·서술어를 찾아 칸을 차지하는 1:1 대전 게임.",
   grade:"5학년", tool:"Firebase", tags:["문장 성분","대전"], url:"#"},
  {kind:"app", date:"2026-09-12", subject:"국어", title:"뒹굴뒹굴 레이싱",
   desc:"문장 호응이 맞는 길을 골라 달리는 레이싱 게임.",
   grade:"5학년", tool:"Three.js", tags:["문장 호응","3D"], url:"#"},
  {kind:"note", date:"2026-09-08", subject:"학급운영", title:"게임형 복습, 수업 어디에 넣을까",
   desc:"수업 끝 10분보다 단원 중간에 넣었을 때 반응이 좋았다.",
   tags:["복습","수업설계"],
   body:`<p>(예시 글) 세 가지 위치에서 써 본 결과:</p>
   <ul><li><b>수업 시작</b>: 지난 시간 복습용으로 5분이면 충분</li>
   <li><b>단원 중간</b>: 헷갈리는 개념을 찾기 좋음</li>
   <li><b>수업 끝</b>: 시간이 밀리면 가장 먼저 잘림</li></ul>`},
  {kind:"app", date:"2026-08-25", subject:"학급운영", title:"우리 반 탐험대",
   desc:"5학년 학급 운영을 위한 탐험대 테마 관리 앱.",
   grade:"5학년", tool:"React", tags:["학급 경영"], url:"#"},
  {kind:"app", date:"2026-08-10", subject:"영어", title:"Dokdo",
   desc:"섬을 돌아다니며 영어 단어를 익히는 오픈월드 어드벤처.",
   grade:"5·6학년", tool:"Three.js", tags:["단어","3D","RPG"], url:"#"}
];

const KINDS=[["all","전체"],["app","웹앱"],["note","노하우"]];
const SUBJECTS=["국어","영어","사회","실과","학급운영","행사","만들기"];
let state={kind:"all",subject:null};
try{const s=JSON.parse(localStorage.getItem("dk-filter")||"null");if(s)state=s}catch(e){}

const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderFilters(){
  const f=$("#filters");
  f.innerHTML='<span class="label">종류</span>'+
    KINDS.map(([k,l])=>`<button class="chip" id="k-${k}" data-kind="${k}" aria-pressed="${state.kind===k}">${l}</button>`).join("")+
    '<span class="sep" aria-hidden="true"></span><span class="label">분야</span>'+
    SUBJECTS.map((s,i)=>`<button class="chip" id="s-${i}" data-subject="${s}" aria-pressed="${state.subject===s}">${s}</button>`).join("");
}
function renderList(){
  const items=RECORDS.filter(r=>(state.kind==="all"||r.kind===state.kind)&&(!state.subject||r.subject===state.subject))
    .sort((a,b)=>b.date.localeCompare(a.date));
  const groups={};
  items.forEach(r=>{const m=r.date.slice(0,7).replace("-",".");(groups[m]=groups[m]||[]).push(r)});
  $("#list").innerHTML=Object.entries(groups).map(([m,rs])=>`
    <section class="month"><h2>${m}</h2><div class="entries">${rs.map(card).join("")}</div></section>`).join("");
  $("#empty").hidden=items.length>0;
}
function card(r){
  const date=r.date.slice(5).replace("-",".");
  const tags=`<div class="tags">${[r.subject,...r.tags].map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`;
  if(r.kind==="app") return `<article class="entry app">
    <div class="top"><span class="kind">웹앱</span><span class="date">${date}</span></div>
    <h3>${esc(r.title)}</h3><p>${esc(r.desc)}</p>
    <div class="meta"><span>대상 <b>${esc(r.grade)}</b></span><span>만든 도구 <b>${esc(r.tool)}</b></span></div>
    <div class="foot">${tags}<a class="open" href="${esc(r.url)}">열어 보기 →</a></div></article>`;
  return `<article class="entry note">
    <div class="top"><span class="kind">노하우</span><span class="date">${date}</span></div>
    <h3>${esc(r.title)}</h3><p>${esc(r.desc)}</p>
    <details><summary>글 전체</summary><div class="body">${r.body}</div></details>
    <div class="foot">${tags}</div></article>`;
}
$("#filters").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.kind) state.kind=b.dataset.kind;
  if(b.dataset.subject) state.subject=state.subject===b.dataset.subject?null:b.dataset.subject;
  try{localStorage.setItem("dk-filter",JSON.stringify(state))}catch(e){}
  renderFilters();renderList();
});
document.addEventListener("click",e=>{const a=e.target.closest('a.open[href="#"]');if(a){e.preventDefault();a.textContent="링크 연결 전";}});
$("#nApp").textContent=RECORDS.filter(r=>r.kind==="app").length;
$("#nNote").textContent=RECORDS.filter(r=>r.kind==="note").length;
renderFilters();renderList();
</script>
</body>
</html>
